name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy the current main from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  # Both are required by the official Pages actions: `pages` to publish, and
  # `id-token` for the OIDC token deploy-pages exchanges for a deployment.
  pages: write
  id-token: write

# Never let two deploys race. cancel-in-progress stays false so an in-flight
# publish finishes rather than leaving the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gate. Every step below must pass before the artifact is uploaded,
      # so a red test means nothing is published — the live site keeps serving
      # the last good deploy rather than being replaced by a broken one.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - uses: actions/configure-pages@v5

      # Runs tsc --noEmit again as part of the script; a few seconds, and it
      # keeps `npm run build` meaning the same thing locally and in CI.
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
